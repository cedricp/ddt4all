name: DDT4ALL APP

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.x"]
        platform:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: windows-latest
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Verify Linux/macOS architecture
        if: runner.os == 'Linux' || runner.os == 'macOS'
        env:
          EXPECTED_ARCH: ${{ matrix.platform.architecture }}
        run: |
          python -c "import os, platform; expected = os.environ['EXPECTED_ARCH']; actual = platform.machine(); actual = {'aarch64': 'arm64', 'amd64': 'x86_64'}.get(actual.lower(), actual.lower()); print(f'Expected {expected}; Python is {actual}'); assert actual == expected"

      # Linux only: install xvfb
      - name: Install system deps (Qt headless - Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libbluetooth-dev bluetooth

      - name: Install project (pyproject.toml + dev deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,can,network,bluetooth]" --no-warn-script-location

      # Run tests on Linux with xvfb
      - name: Run tests with coverage (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a pytest --cov=ddt4all --cov-report=term-missing --cov-report=xml

      # Run tests on macOS and Windows
      - name: Run tests with coverage (macOS / Windows)
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --cov=ddt4all --cov-report=term-missing --cov-report=xml

      # Optional: upload coverage
      # - name: Upload coverage to Codecov
      #   if: ${{ !cancelled() }}
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: coverage.xml
      #     fail_ci_if_error: true
      #     token: ${{ secrets.CODECOV_TOKEN }}
